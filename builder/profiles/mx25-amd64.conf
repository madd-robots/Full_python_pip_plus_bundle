# Target profile: MX Linux 25.x (Debian 13 "trixie" base), amd64. Also accepted:
# plain Debian 13 (MX 25's base distribution).
# Parsed as KEY=VALUE by the builder and install.sh; never sourced/executed.
PROFILE_ID=mx25-amd64
BUNDLE_NAME=madd-python-full-mx25-amd64
TARGET_DISTRIBUTION=MX Linux 25.x / Debian 13 (trixie)
TARGET_FAMILY=debian
TARGET_OS_ID=debian
TARGET_VERSION_ID=13
TARGET_CODENAME=trixie
# Accepted /etc/mx-version prefix on MX systems.
TARGET_MX_RELEASE=MX-25
# Keyring already installed on the target that verifies the bundled APT metadata.
TARGET_KEYRING=/usr/share/keyrings/debian-archive-keyring.gpg
DEB_ARCH=amd64
UNAME_MACHINE=x86_64
WHEEL_PLATFORM_ARCH=x86_64
REPO_IDS=main security
REPO_MAIN_URI=https://deb.debian.org/debian
REPO_MAIN_SUITES=trixie trixie-updates
REPO_SECURITY_URI=https://deb.debian.org/debian-security
REPO_SECURITY_SUITES=trixie-security
REPO_COMPONENTS=main
# Keyring used by the APT stage on the builder side.
STAGING_KEYRING=/usr/share/keyrings/debian-archive-keyring.gpg
STAGING_KEYRING_PACKAGE=debian-archive-keyring
# Signed Debian 13.0 release index used to model un-updated MX 25 machines.
BASELINE_URI=https://snapshot.debian.org/archive/debian/20250815T000000Z
BASELINE_SUITES=trixie
# Packages assumed present on an MX 25 desktop in addition to the standard set.
BASELINE_EXTRA_PACKAGES=systemd udev python3 libx11-xcb1 libxft2 fontconfig libtk8.6 tk8.6 perl openssl sudo
