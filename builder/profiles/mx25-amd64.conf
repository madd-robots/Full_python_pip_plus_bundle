# Target profile: MX Linux 25.x (Debian 13 "trixie" base), amd64.
# Parsed as KEY=VALUE by madd_stage.py and install.sh; never sourced/executed.
PROFILE_ID=mx25-amd64
BUNDLE_NAME=madd-python-full-mx25-amd64
TARGET_DISTRIBUTION=MX Linux 25.x
DEBIAN_VERSION=13
DEBIAN_CODENAME=trixie
DEB_ARCH=amd64
UNAME_MACHINE=x86_64
WHEEL_PLATFORM_ARCH=x86_64
DEBIAN_MIRROR=https://deb.debian.org/debian
DEBIAN_SECURITY_MIRROR=https://deb.debian.org/debian-security
DEBIAN_SUITES=trixie trixie-updates
DEBIAN_SECURITY_SUITES=trixie-security
DEBIAN_COMPONENTS=main
# Signed Debian 13.0 release index used to model un-updated MX 25 machines.
DEBIAN_BASELINE_SNAPSHOT=https://snapshot.debian.org/archive/debian/20250815T000000Z
# Packages assumed present on an MX 25 desktop in addition to the standard set.
BASELINE_EXTRA_PACKAGES=systemd udev python3 libx11-xcb1 libxft2 fontconfig libtk8.6 tk8.6 perl openssl sudo
