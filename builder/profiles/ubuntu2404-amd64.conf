# Target profile: Ubuntu 24.04 LTS "noble", amd64.
# Parsed as KEY=VALUE by the builder and install.sh; never sourced/executed.
PROFILE_ID=ubuntu2404-amd64
BUNDLE_NAME=madd-python-full-ubuntu2404-amd64
TARGET_DISTRIBUTION=Ubuntu 24.04 LTS (noble)
TARGET_FAMILY=ubuntu
TARGET_OS_ID=ubuntu
TARGET_VERSION_ID=24.04
TARGET_CODENAME=noble
TARGET_MX_RELEASE=
TARGET_KEYRING=/usr/share/keyrings/ubuntu-archive-keyring.gpg
DEB_ARCH=amd64
UNAME_MACHINE=x86_64
WHEEL_PLATFORM_ARCH=x86_64
REPO_IDS=main security
REPO_MAIN_URI=https://archive.ubuntu.com/ubuntu
REPO_MAIN_SUITES=noble noble-updates
REPO_SECURITY_URI=https://security.ubuntu.com/ubuntu
REPO_SECURITY_SUITES=noble-security
REPO_COMPONENTS=main universe
STAGING_KEYRING=/usr/share/keyrings/ubuntu-archive-keyring.gpg
STAGING_KEYRING_PACKAGE=ubuntu-keyring
# The "noble" release pocket is frozen at release time: it models un-updated machines.
BASELINE_URI=https://archive.ubuntu.com/ubuntu
BASELINE_SUITES=noble
BASELINE_EXTRA_PACKAGES=systemd udev python3 libx11-xcb1 libxft2 fontconfig libtk8.6 tk8.6 perl openssl sudo
